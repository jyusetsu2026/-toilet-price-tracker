name: 毎日の価格レポート更新

# 手動実行ボタンからも動かせるようにしておく（動作確認用）
on:
  workflow_dispatch: {}
  schedule:
    # UTC 01:00 = 日本時間(JST) 10:00
    - cron: "0 1 * * *"

# レポートの更新結果をリポジトリにコミットするための権限
permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: 価格を調査してレポートを作成
        run: python scrape_prices.py

      - name: 更新内容をコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/report.json
          git diff --cached --quiet || git commit -m "自動更新: 価格レポート ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
